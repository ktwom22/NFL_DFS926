<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DraftKings NFL Multi-Lineup Optimizer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --cpt-badge: #f59e0b;
      --chip: #3b82f6;
    }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 25px; margin: 0; }
    .container { max-width: 1040px; margin: auto; }
    .control-panel { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 18px; margin-bottom: 20px; }
    .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    select, button { padding: 9px 12px; border-radius: 6px; font-size: 0.92rem; outline: none; background: #0b1120; color: #fff; border: 1px solid var(--border); }
    button { background: var(--accent); color: #052e16; font-weight: 700; border: none; cursor: pointer; }
    button:hover { background: var(--accent-hover); }
    button:disabled { background: #475569; cursor: not-allowed; }
    .banner { background: #0b1120; border: 1px solid var(--border); padding: 10px 14px; border-radius: 6px; margin-top: 12px; display: flex; gap: 14px; font-size: 0.88rem; align-items: center; }
    .chip { background: var(--chip); color: #fff; padding: 2px 7px; border-radius: 4px; font-weight: bold; font-size: 0.78rem; }

    .lineup-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
    .card-header { display: flex; justify-content: space-between; background: #0b1120; padding: 10px 16px; font-weight: 600; font-size: 0.95rem; border-bottom: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; }
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 0.78rem; font-weight: bold; background: #334155; }
    .badge-cpt { background: var(--cpt-badge); color: #78350f; }
    .status { padding: 10px; border-radius: 6px; margin: 10px 0; font-size: 0.9rem; display: none; }
    .err { background: #7f1d1d; color: #fca5a5; display: block; }
    .loading { background: #1e3a8a; color: #93c5fd; display: block; }

    .tooltip-container { position: relative; display: inline-flex; align-items: center; cursor: help; margin-left: 4px; }
    .info-circle { background: #475569; color: #fff; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; font-weight: bold; display: inline-flex; align-items: center; justify-content: center; }
    .tooltip-text {
      visibility: hidden; width: 320px; background-color: #020617; color: #e2e8f0; text-align: left;
      border-radius: 6px; padding: 12px; position: absolute; z-index: 100; bottom: 130%; left: 50%;
      transform: translateX(-50%); opacity: 0; transition: opacity 0.2s; border: 1px solid var(--border);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); font-size: 0.8rem; line-height: 1.4;
    }
    .tooltip-container:hover .tooltip-text { visibility: visible; opacity: 1; }
    .tooltip-text ul { padding-left: 16px; margin: 6px 0 0 0; }
    .tooltip-text li { margin-bottom: 4px; }
    .stat-tag { color: var(--accent); font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <div class="control-panel">
    <h2 style="margin: 0 0 14px 0;">DraftKings NFL Multi-Lineup Optimizer</h2>

    <div class="row">
      <label>
        Slate:
        <select id="slateSelect" onchange="handleSlateChange()">
          <optgroup label="Showdown (Single Game)">
            {% for s in slates if s.type == 'showdown' %}
              <option value="{{ s.id }}" data-type="showdown">{{ s.label }}</option>
            {% endfor %}
          </optgroup>
          <optgroup label="Classic Slates">
            {% for s in slates if s.type == 'classic' %}
              <option value="{{ s.id }}" data-type="classic">{{ s.label }}</option>
            {% endfor %}
          </optgroup>
        </select>
      </label>

      <!-- Contest Type Selector -->
      <label>
        Contest:
        <select id="contestTypeSelect">
          <option value="milly_maker" selected>Milly Maker (Large-Field 150-Max)</option>
          <option value="limited_entry">Limited Entry (3-Max / 20-Max)</option>
          <option value="single_entry">Single Entry (SE / Small-Field)</option>
        </select>
        <span class="tooltip-container">
          <span class="info-circle">i</span>
          <div class="tooltip-text">
            <strong>Contest-Driven Strategy:</strong>
            <ul>
              <li><span class="stat-tag">Milly Maker:</span> Exactly 1 TE enforced (strictly bans dual-TE flex). Highest variance (16%). High portfolio diversification.</li>
              <li><span class="stat-tag">Limited Entry:</span> Exactly 1 TE enforced. Balanced ceiling (12% variance). Anchors core volume.</li>
              <li><span class="stat-tag">Single Entry:</span> Low variance (8%). Maximizes median volume; dual-TE allowed only if optimal.</li>
            </ul>
          </div>
        </span>
      </label>

      <!-- Showdown Script Control -->
      <label id="scriptLabel">
        Script:
        <select id="gameScriptSelect">
          <option value="auto">Auto-Detect (Based on Vegas Line)</option>
          <option value="shootout">Dual-QB High Scoring Shootout</option>
          <option value="balanced">Balanced / Competitive (3-3 or 4-2)</option>
          <option value="5_1_onslaught">5-1 Favorite Blowout</option>
          <option value="defensive_slugfest">Defensive Slugfest (K/DST Heavy)</option>
          <option value="underdog_chase">Underdog Trailing WR/QB Chase</option>
          <option value="naked_receiver">Naked WR Captain (No QB Stack)</option>
        </select>
      </label>

      <!-- Classic Stacking Control -->
      <label id="stackLabel" style="display: none;">
        Stacking:
        <select id="stackStyleSelect">
          <option value="game_stack" selected>Game Stack (QB + Pass Catcher + Bring-Back)</option>
          <option value="double_game_stack">Double Game Stack (QB + 2 WR/TE + Bring-Back)</option>
          <option value="double_stack">Double Stack (QB + 2 WR/TE)</option>
          <option value="single_stack">Single Stack (QB + 1 WR/TE)</option>
          <option value="naked_qb">Naked QB (No Pass Catchers)</option>
          <option value="none">Unrestricted (Solver Discretion)</option>
        </select>
        <span class="tooltip-container">
          <span class="info-circle">i</span>
          <div class="tooltip-text">
            <strong>Historical DK Milly Maker Win Rates:</strong>
            <ul>
              <li><span class="stat-tag">Game Stack (82-85%):</span> Pair QB with pass-catcher + opponent bring-back.</li>
              <li><span class="stat-tag">Double Stack (55-60%):</span> Dominates pocket passers (Purdy, Mahomes).</li>
              <li><span class="stat-tag">Naked QB (&lt;10%):</span> Only viable for high-volume rushing QBs (Lamar, Allen).</li>
            </ul>
          </div>
        </span>
      </label>

      <!-- Optional Team to Stack Dropdown -->
      <label id="teamStackLabel" style="display: none;">
        Stack Team:
        <select id="teamStackSelect">
          <option value="ANY" selected>Any Team (Optimal)</option>
        </select>
      </label>

      <label>
        Lineups:
        <select id="nLineups">
          <option value="1">1</option>
          <option value="3">3</option>
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="20">20</option>
        </select>
      </label>

      <label><input type="checkbox" id="boomEngine" checked> 85th% Boom Engine</label>
      <label id="allowKDstLabel"><input type="checkbox" id="allowKDst" checked> Allow K/DST</label>

      <button id="solveBtn" onclick="runOptimization()">Optimize</button>
    </div>

    <div id="vegasBanner" class="banner" style="display: none;">
      <span class="chip">VEGAS METRICS</span>
      <span id="vegasSpread">Spread: -</span>
      <span id="vegasTotal">O/U: -</span>
      <span id="vegasImplied">Implied: -</span>
      <span id="vegasSuggested">Suggested: -</span>
    </div>
  </div>

  <div id="msg" class="status"></div>
  <div id="resultsContainer"></div>
</div>

<script>
let currentVegas = null;

async function handleSlateChange() {
  const sel = document.getElementById("slateSelect");
  const opt = sel.options[sel.selectedIndex];
  const isShowdown = opt && opt.dataset.type === "showdown";

  document.getElementById("scriptLabel").style.display = isShowdown ? "inline-block" : "none";
  document.getElementById("allowKDstLabel").style.display = isShowdown ? "inline-block" : "none";
  document.getElementById("stackLabel").style.display = isShowdown ? "none" : "inline-block";
  document.getElementById("teamStackLabel").style.display = isShowdown ? "none" : "inline-block";

  try {
    const res = await fetch("/api/vegas-info", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ draft_group_id: parseInt(opt.value) })
    });
    const data = await res.json();

    const teamSelect = document.getElementById("teamStackSelect");
    teamSelect.innerHTML = '<option value="ANY" selected>Any Team (Optimal)</option>';
    if (data.status === "success" && Array.isArray(data.teams)) {
      data.teams.forEach(t => {
        teamSelect.innerHTML += `<option value="${t}">${t}</option>`;
      });
    }

    if (isShowdown && data.status === "success" && data.vegas) {
      currentVegas = data.vegas;
      document.getElementById("vegasSpread").innerText = `Spread: ${data.vegas.favorite} -${data.vegas.spread}`;
      document.getElementById("vegasTotal").innerText = `O/U: ${data.vegas.over_under}`;
      document.getElementById("vegasImplied").innerText = `${data.vegas.favorite} ${data.vegas.fav_implied} | ${data.vegas.underdog} ${data.vegas.und_implied}`;
      document.getElementById("vegasSuggested").innerText = `Auto Script: ${data.vegas.recommended_script.toUpperCase()}`;
      document.getElementById("vegasBanner").style.display = "flex";
    } else {
      document.getElementById("vegasBanner").style.display = "none";
    }
  } catch (err) {
    document.getElementById("vegasBanner").style.display = "none";
  }
}

async function runOptimization() {
  const sel = document.getElementById("slateSelect");
  const opt = sel.options[sel.selectedIndex];
  if (!opt) return;

  const btn = document.getElementById("solveBtn");
  const msg = document.getElementById("msg");
  const container = document.getElementById("resultsContainer");

  btn.disabled = true;
  msg.className = "status loading";
  msg.innerText = "Applying game-stack & contest rules...";
  container.innerHTML = "";

  try {
    const res = await fetch("/api/optimize", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        draft_group_id: parseInt(opt.value),
        slate_type: opt.dataset.type,
        contest_type: document.getElementById("contestTypeSelect").value,
        game_script: document.getElementById("gameScriptSelect").value,
        stack_style: document.getElementById("stackStyleSelect").value,
        primary_stack_team: document.getElementById("teamStackSelect").value,
        use_boom_engine: document.getElementById("boomEngine").checked,
        n_lineups: parseInt(document.getElementById("nLineups").value || "10"),
        favorite_team: currentVegas?.favorite,
        underdog_team: currentVegas?.underdog,
        allow_k_dst: document.getElementById("allowKDst").checked
      })
    });

    const text = await res.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      throw new Error(`Server returned non-JSON response (HTTP ${res.status}): ${text.substring(0, 150)}...`);
    }

    if (!res.ok || data.status === "error") {
      throw new Error(data.message || "Optimization failed.");
    }

    let lineupsList = [];
    if (Array.isArray(data.lineups)) {
      lineupsList = data.lineups;
    } else if (Array.isArray(data.lineup)) {
      lineupsList = [{
        lineup_num: 1,
        total_salary: data.total_salary,
        total_proj: data.total_projected_fpts,
        players: data.lineup
      }];
    }

    if (lineupsList.length === 0) {
      throw new Error("No lineups were generated.");
    }

    lineupsList.forEach(l => {
      const players = l.players || [];
      let rows = "";
      players.forEach(p => {
        const isCpt = p.Slot === "CPT";
        rows += `<tr>
          <td><span class="badge ${isCpt ? 'badge-cpt' : ''}">${p.Slot}</span></td>
          <td><strong>${p.Name}</strong></td>
          <td>${p.Position}</td>
          <td>${p.Team}</td>
          <td>$${(p.Salary || 0).toLocaleString()}</td>
          <td>${(p.Proj_FPTS || 0).toFixed(2)}</td>
        </tr>`;
      });

      container.innerHTML += `
        <div class="lineup-card">
          <div class="card-header">
            <span>Lineup #${l.lineup_num} [${(data.executed_script || 'OPTIMAL').toUpperCase()}]</span>
            <span>Salary: $${(l.total_salary || 0).toLocaleString()} / $50,000 | Proj: ${(l.total_proj || 0).toFixed(2)} FPTS</span>
          </div>
          <table>
            <thead>
              <tr><th>Slot</th><th>Name</th><th>Pos</th><th>Team</th><th>Salary</th><th>Proj FPTS</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    });

    msg.style.display = "none";
  } catch (e) {
    msg.className = "status err";
    msg.innerText = e.message;
  } finally {
    btn.disabled = false;
  }
}

window.onload = handleSlateChange;
</script>
</body>
</html>
